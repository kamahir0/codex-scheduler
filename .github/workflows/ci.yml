name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-all:
    name: Mechanical Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Run all mechanical checks
        run: cargo xtask check-all

  windows-test:
    name: Windows Verification & Task Scheduler Smoke
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests
        run: cargo test --workspace

      - name: CLI Task Scheduler smoke test
        shell: bash
        run: |
          cargo run -p codex-scheduler-cli -- status
          cargo run -p codex-scheduler-cli -- install-scheduler
          cargo run -p codex-scheduler-cli -- status --json
          cargo run -p codex-scheduler-cli -- uninstall-scheduler
          cargo run -p codex-scheduler-cli -- status --json
