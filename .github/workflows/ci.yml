name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-all:
    name: Mechanical Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Run all mechanical checks
        run: cargo xtask check-all

  windows-test:
    name: Windows Verification & Task Scheduler Smoke
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests
        run: cargo test --workspace

      - name: CLI Task Scheduler smoke test (Administrator)
        shell: bash
        run: |
          cargo run -p codex-scheduler-cli -- status
          cargo run -p codex-scheduler-cli -- install-scheduler
          cargo run -p codex-scheduler-cli -- status --json
          cargo run -p codex-scheduler-cli -- uninstall-scheduler
          cargo run -p codex-scheduler-cli -- status --json

      - name: Standard User Task Scheduler Empirical Verification
        shell: powershell
        run: |
          Write-Host "=== 1. Creating standard user 'standarduser' ==="
          net user standarduser "StandardP@ss123!" /add /expires:never
          
          $adminMembers = net localgroup Administrators
          Write-Host "Administrators:"
          $adminMembers
          
          Write-Host "=== 2. Granting directory access to standarduser ==="
          icacls target /grant "standarduser:(OI)(CI)RX" /T | Out-Null
          icacls . /grant "standarduser:(OI)(CI)RX" /T | Out-Null

          Write-Host "=== 3. Testing schtasks /Create as standarduser via ProcessStartInfo ==="
          $secPassword = ConvertTo-SecureString "StandardP@ss123!" -AsPlainText -Force
          
          # Test script to run as standard user
          $testScript = @"
          Write-Host 'Current Identity:'
          whoami
          whoami /groups
          Write-Host 'Testing codex-scheduler install-scheduler:'
          & '$PWD\target\debug\codex-scheduler.exe' install-scheduler
          Write-Host "install-scheduler exit code: `$LASTEXITCODE"
          & '$PWD\target\debug\codex-scheduler.exe' status --json
          & '$PWD\target\debug\codex-scheduler.exe' uninstall-scheduler
          Write-Host "uninstall-scheduler exit code: `$LASTEXITCODE"
          "@
          Set-Content -Path "$PWD\run_as_standard.ps1" -Value $testScript

          $pinfo = New-Object System.Diagnostics.ProcessStartInfo
          $pinfo.FileName = "powershell.exe"
          $pinfo.Arguments = "-NoProfile -ExecutionPolicy Bypass -File `"$PWD\run_as_standard.ps1`""
          $pinfo.UserName = "standarduser"
          $pinfo.Password = $secPassword
          $pinfo.UseShellExecute = $false
          $pinfo.RedirectStandardOutput = $true
          $pinfo.RedirectStandardError = $true
          $pinfo.WorkingDirectory = "$PWD"

          try {
            $process = [System.Diagnostics.Process]::Start($pinfo)
            $stdout = $process.StandardOutput.ReadToEnd()
            $stderr = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            Write-Host "=== Standard User Execution Output ==="
            Write-Host "ExitCode: $($process.ExitCode)"
            Write-Host "STDOUT:"
            Write-Host $stdout
            Write-Host "STDERR:"
            Write-Host $stderr
          } catch {
            Write-Host "Process start error: $_"
          }

