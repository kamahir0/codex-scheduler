name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-all:
    name: Mechanical Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Run all mechanical checks
        run: cargo xtask check-all

  windows-test:
    name: Windows Verification & Task Scheduler Smoke
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests
        run: cargo test --workspace

      - name: CLI Task Scheduler smoke test (Administrator)
        shell: bash
        run: |
          cargo run -p codex-scheduler-cli -- status
          cargo run -p codex-scheduler-cli -- install-scheduler
          cargo run -p codex-scheduler-cli -- status --json
          cargo run -p codex-scheduler-cli -- uninstall-scheduler
          cargo run -p codex-scheduler-cli -- status --json

      - name: Standard User Task Scheduler Empirical Verification
        shell: powershell
        run: |
          Write-Host "=== 1. Creating standard user 'standarduser' ==="
          $pass = ConvertTo-SecureString "StdPass1234!" -AsPlainText -Force
          New-LocalUser -Name "standarduser" -Password $pass -PasswordNeverExpires -Description "Standard Test User"
          
          $adminMembers = Get-LocalGroupMember -Group "Administrators"
          Write-Host "Administrators members:"
          $adminMembers | ForEach-Object { $_.Name }
          
          $userMembers = Get-LocalGroupMember -Group "Users"
          Write-Host "Users members:"
          $userMembers | ForEach-Object { $_.Name }

          Write-Host "=== 2. Granting directory access to standarduser ==="
          icacls target /grant "standarduser:(OI)(CI)RX" /T | Out-Null
          icacls . /grant "standarduser:(OI)(CI)RX" /T | Out-Null

          Write-Host "=== 3. Testing schtasks /Create as standarduser via ProcessStartInfo ==="
          $secPassword = ConvertTo-SecureString "StdPass1234!" -AsPlainText -Force
          
          # Test script to run as standard user
          $testScript = @"
          Write-Host '--- Current Identity ---'
          whoami
          whoami /groups
          Write-Host 'USERPROFILE:' `$env:USERPROFILE

          Write-Host '--- Testing Task Scheduler COM API as Standard User ---'
          try {
            `$service = New-Object -ComObject "Schedule.Service"
            `$service.Connect()
            `$folder = `$service.GetFolder("\")
            `$task = `$service.NewTask(0)
            `$task.RegistrationInfo.Description = "COM Standard User Test"
            `$principal = `$task.Principal
            `$principal.LogonType = 3 # TASK_LOGON_INTERACTIVE_TOKEN
            `$principal.RunLevel = 0  # LeastPrivilege
            
            # Action
            `$action = `$task.Actions.Create(0) # TASK_ACTION_EXEC
            `$action.Path = "cmd.exe"
            `$action.Arguments = "/c exit 0"
            
            # Trigger
            `$trigger = `$task.Triggers.Create(1) # TASK_TRIGGER_TIME
            `$trigger.StartBoundary = (Get-Date).AddMinutes(1).ToString("s")
            
            # Register in root folder
            Write-Host "Calling RegisterTaskDefinition in root folder '\'..."
            `$registeredTask = `$folder.RegisterTaskDefinition("StandardTestTaskCOM", `$task, 6, `$null, `$null, 3, `$null)
            Write-Host "SUCCESS: Task registered via COM API! Name: `$(`$registeredTask.Name), State: `$(`$registeredTask.State)"
            
            # Delete task to clean up
            `$folder.DeleteTask("StandardTestTaskCOM", 0)
            Write-Host "SUCCESS: Task deleted via COM API!"
          } catch {
            Write-Host "COM API Root Folder Error: `$($_.Exception.Message) (HRESULT: `$(('0x{0:X}' -f `$_.Exception.HResult)))"
          }

          Write-Host '--- Testing Task Scheduler COM API in Subfolder ---'
          try {
            `$service = New-Object -ComObject "Schedule.Service"
            `$service.Connect()
            `$rootFolder = `$service.GetFolder("\")
            # Try creating subfolder if root failed
            `$subFolder = `$rootFolder.CreateFolder("CodexScheduler", `$null)
            Write-Host "Subfolder created: `$(`$subFolder.Path)"
            `$registeredTask = `$subFolder.RegisterTaskDefinition("StandardTestTaskCOM", `$task, 6, `$null, `$null, 3, `$null)
            Write-Host "SUCCESS: Task registered in subfolder! State: `$(`$registeredTask.State)"
          } catch {
            Write-Host "COM API Subfolder Error: `$($_.Exception.Message) (HRESULT: `$(('0x{0:X}' -f `$_.Exception.HResult)))"
          }

          Write-Host '--- Testing codex-scheduler CLI ---'
          & '$PWD\target\debug\codex-scheduler.exe' status --json
          "@
          Set-Content -Path "$PWD\run_as_standard.ps1" -Value $testScript

          $pinfo = New-Object System.Diagnostics.ProcessStartInfo
          $pinfo.FileName = "powershell.exe"
          $pinfo.Arguments = "-NoProfile -ExecutionPolicy Bypass -File `"$PWD\run_as_standard.ps1`""
          $pinfo.UserName = "standarduser"
          $pinfo.Password = $secPassword
          $pinfo.LoadUserProfile = $true
          $pinfo.UseShellExecute = $false
          $pinfo.RedirectStandardOutput = $true
          $pinfo.RedirectStandardError = $true
          $pinfo.WorkingDirectory = "$PWD"

          try {
            $process = [System.Diagnostics.Process]::Start($pinfo)
            $stdout = $process.StandardOutput.ReadToEnd()
            $stderr = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            Write-Host "=== Standard User Execution Output ==="
            Write-Host "ExitCode: $($process.ExitCode)"
            Write-Host "STDOUT:"
            Write-Host $stdout
            Write-Host "STDERR:"
            Write-Host $stderr
          } catch {
            Write-Host "Process start error: $_"
          }


