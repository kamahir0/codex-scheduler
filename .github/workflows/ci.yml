name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-all:
    name: Mechanical Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Run all mechanical checks
        run: cargo xtask check-all

  windows-test:
    name: Windows Verification & Task Scheduler Smoke
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests
        run: cargo test --workspace

      - name: CLI Task Scheduler smoke test (Administrator)
        shell: bash
        run: |
          cargo run -p codex-scheduler-cli -- status
          cargo run -p codex-scheduler-cli -- install-scheduler
          cargo run -p codex-scheduler-cli -- status --json
          cargo run -p codex-scheduler-cli -- uninstall-scheduler
          cargo run -p codex-scheduler-cli -- status --json

      - name: Standard User Task Scheduler Acceptance Test
        shell: powershell
        run: |
          Write-Host "=== 1. Creating non-admin user 'standarduser' ==="
          $pass = ConvertTo-SecureString "StdPass1234!" -AsPlainText -Force
          New-LocalUser -Name "standarduser" -Password $pass -PasswordNeverExpires -Description "Standard Non-Admin User"
          
          $adminMembers = Get-LocalGroupMember -Group "Administrators"
          Write-Host "Administrators members:"
          $adminMembers | ForEach-Object { $_.Name }
          if ($adminMembers.Name -contains "$env:COMPUTERNAME\standarduser") {
            Write-Error "FATAL: standarduser MUST NOT be in Administrators group!"
            exit 1
          }

          Write-Host "=== 2. Granting directory access to standarduser ==="
          icacls target /grant "standarduser:(OI)(CI)RX" /T | Out-Null
          icacls . /grant "standarduser:(OI)(CI)RX" /T | Out-Null

          Write-Host "=== 3. Running standard-user acceptance test script ==="
          $secPassword = ConvertTo-SecureString "StdPass1234!" -AsPlainText -Force
          
          # Test script to run in standard user security context
          $testScript = @"
          `$ErrorActionPreference = 'Stop'
          Write-Host '--- Current Identity ---'
          whoami
          whoami /groups
          Write-Host 'USERPROFILE:' `$env:USERPROFILE

          Write-Host '--- 1. Initial Status (should be uninstalled) ---'
          `$initialStatus = & '$PWD\target\debug\codex-scheduler.exe' status --json | ConvertFrom-Json
          if (`$initialStatus.scheduler.installed -ne `$false -or `$initialStatus.scheduler.ready -ne `$false) {
            Write-Error "Expected scheduler to be uninstalled initially, got: `$(`$initialStatus | ConvertTo-Json -Compress)"
            exit 1
          }
          Write-Host 'PASS: Initial status is uninstalled.'

          Write-Host '--- 2. Install Scheduler as Standard User (COM API) ---'
          & '$PWD\target\debug\codex-scheduler.exe' install-scheduler
          if (`$LASTEXITCODE -ne 0) {
            Write-Error "install-scheduler failed with exit code `$LASTEXITCODE"
            exit 1
          }
          Write-Host 'PASS: install-scheduler succeeded.'

          Write-Host '--- 3. Verify Status after Install ---'
          `$postInstallStatus = & '$PWD\target\debug\codex-scheduler.exe' status --json | ConvertFrom-Json
          if (`$postInstallStatus.scheduler.installed -ne `$true -or `$postInstallStatus.scheduler.ready -ne `$true -or `$postInstallStatus.scheduler.owner -ne 'cli') {
            Write-Error "Expected scheduler to be installed/ready/cli, got: `$(`$postInstallStatus | ConvertTo-Json -Compress)"
            exit 1
          }
          Write-Host 'PASS: Scheduler verified as installed, ready, and owned by cli.'

          Write-Host '--- 4. Uninstall Scheduler as Standard User ---'
          & '$PWD\target\debug\codex-scheduler.exe' uninstall-scheduler
          if (`$LASTEXITCODE -ne 0) {
            Write-Error "uninstall-scheduler failed with exit code `$LASTEXITCODE"
            exit 1
          }
          Write-Host 'PASS: uninstall-scheduler succeeded.'

          Write-Host '--- 5. Verify Status after Uninstall ---'
          `$postUninstallStatus = & '$PWD\target\debug\codex-scheduler.exe' status --json | ConvertFrom-Json
          if (`$postUninstallStatus.scheduler.installed -ne `$false -or `$postUninstallStatus.scheduler.ready -ne `$false -or `$postUninstallStatus.scheduler.owner -ne 'none') {
            Write-Error "Expected scheduler to be uninstalled, got: `$(`$postUninstallStatus | ConvertTo-Json -Compress)"
            exit 1
          }
          Write-Host 'PASS: Scheduler successfully uninstalled.'

          Write-Host '=== ALL STANDARD USER ACCEPTANCE CHECKS PASSED ==='
          "@
          Set-Content -Path "$PWD\run_as_standard.ps1" -Value $testScript

          $pinfo = New-Object System.Diagnostics.ProcessStartInfo
          $pinfo.FileName = "powershell.exe"
          $pinfo.Arguments = "-NoProfile -ExecutionPolicy Bypass -File `"$PWD\run_as_standard.ps1`""
          $pinfo.UserName = "standarduser"
          $pinfo.Password = $secPassword
          $pinfo.LoadUserProfile = $true
          $pinfo.UseShellExecute = $false
          $pinfo.RedirectStandardOutput = $true
          $pinfo.RedirectStandardError = $true
          $pinfo.WorkingDirectory = "$PWD"

          $process = [System.Diagnostics.Process]::Start($pinfo)
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()

          Write-Host "Standard User Process ExitCode: $($process.ExitCode)"
          Write-Host "STDOUT:"
          Write-Host $stdout
          if ($stderr) {
            Write-Host "STDERR:"
            Write-Host $stderr
          }

          if ($process.ExitCode -ne 0) {
            Write-Error "Standard user acceptance test failed with exit code $($process.ExitCode)"
            exit 1
          }



