name: Release Desktop Applications

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Build worker CLI binary (Windows only)
        if: matrix.platform == 'windows-x64'
        run: cargo build --package codex-scheduler-cli --release --target ${{ matrix.target }}

      - name: Stage worker CLI for bundle (Windows only)
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          mkdir -p apps/gui/src-tauri/resources
          cp target/${{ matrix.target }}/release/codex-scheduler-cli.exe apps/gui/src-tauri/resources/

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: "./apps/gui"
          args: --target ${{ matrix.target }}

      - name: Determine Release Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(node -p "require('./apps/gui/src-tauri/tauri.conf.json').version")
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Stage Release Asset
        shell: bash
        run: |
          mkdir -p release-assets
          VER="${{ steps.version.outputs.version }}"
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            SRC=$(find target -name "*.dmg" -not -name "Codex-Scheduler-*" | head -n 1)
            if [ -z "$SRC" ]; then
              echo "Error: DMG file not found!" >&2
              exit 1
            fi
            echo "Found DMG: $SRC"
            cp "$SRC" "release-assets/Codex-Scheduler-${VER}-macos-arm64.dmg"
          elif [ "${{ matrix.platform }}" = "windows-x64" ]; then
            SRC=$(find target \( -name "*-setup.exe" -o -name "*_x64-setup.exe" -o -name "*_x64.exe" -o -name "*.exe" \) -path "*/bundle/nsis/*" | head -n 1)
            if [ -z "$SRC" ]; then
              echo "Error: NSIS EXE file not found!" >&2
              exit 1
            fi
            echo "Found NSIS EXE: $SRC"
            cp "$SRC" "release-assets/Codex-Scheduler-${VER}-windows-x64.exe"
          fi
          echo "Staged release assets:"
          ls -la release-assets/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-assets/*
          name: "Codex Scheduler ${{ github.ref_name }}"
          body: |
            ## Codex Scheduler ${{ github.ref_name }}

            AIコーディングツール（Codex）利用枠リセット時 自動再開デスクトップツール

            ### Download

            - macOS Apple Silicon (M1以降)
              `Codex-Scheduler-${{ steps.version.outputs.version }}-macos-arm64.dmg`

            - Windows 64-bit
              `Codex-Scheduler-${{ steps.version.outputs.version }}-windows-x64.exe`

            インストール後の起動・権限設定は [セットアップガイド](https://github.com/${{ github.repository }}/blob/main/docs/setup-guide.md) をご覧ください。
          draft: false
          prerelease: false
